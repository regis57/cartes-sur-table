version: 2
updates:
  # Actions GitHub (épinglées par SHA, Dependabot met à jour SHA + commentaire de version)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

