<body class="jeu" data-game="huit-americain">
  <a class="drapeau petit" href="/" aria-label="Jeux de cartes, accueil"><span></span><span></span><span></span></a>

  <section id="lobby" class="lobby"></section>

  <section id="table" hidden>
    <div class="barre"><div class="statut" id="statut" role="status" aria-live="polite"></div></div>
    <button type="button" class="menu-btn" data-action="menu" aria-label="Menu"><i></i><i></i><i></i></button>
    <div class="table-jeu-grille">
      <div class="siege haut" id="siege-2"><div class="etiquette"></div><div class="main horizontale"></div></div>
      <div class="siege gauche" id="siege-1"><div class="etiquette"></div><div class="main verticale"></div></div>
      <div class="centre">
        <div class="couleur" id="couleur"></div>
        <div class="piles">
          <div class="carte dos pioche" id="pioche" role="button" tabindex="0" data-action="draw"><span class="compteur" id="pioche-n"></span></div>
          <div id="defausse"></div>
        </div>
        <div class="sens" id="sens"></div>
      </div>
      <div class="siege droite" id="siege-3"><div class="etiquette"></div><div class="main verticale"></div></div>
      <div class="siege bas" id="siege-0"><div class="etiquette"></div><div class="main horizontale moi" id="ma-main"></div></div>
    </div>
    <div class="reactions">
      <button type="button" data-action="open-emojis" data-i18n="table.emotes">Réactions</button>
      <button type="button" data-action="open-phrases" data-i18n="table.phrases">Phrases</button>
      <button type="button" data-action="menu" data-i18n="table.menu">Menu</button>
    </div>
  </section>

  <dialog id="dlg-couleur">
    <h2 data-i18n="table.choose_suit">Choisissez la couleur de votre 8</h2>
    <div class="couleurs">
      <div class="carte" role="button" tabindex="0" data-suit="♠"><span class="centre">♠</span></div>
      <div class="carte rouge" role="button" tabindex="0" data-suit="♥"><span class="centre">♥</span></div>
      <div class="carte" role="button" tabindex="0" data-suit="♣"><span class="centre">♣</span></div>
      <div class="carte rouge" role="button" tabindex="0" data-suit="♦"><span class="centre">♦</span></div>
    </div>
  </dialog>



</body>
</html>
